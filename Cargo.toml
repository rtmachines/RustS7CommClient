[package]
name = "rust7"
version = "0.2.0"
authors = ["Davide Nardella <davenardella@live.it>"]
edition = "2021"
rust-version = "1.99"
autoexamples = false
description = "Native Rust S7 client (Snap7-style) for Siemens PLCs."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/rust7"
repository = "https://github.com/davenardella/rust7"
homepage = "https://github.com/davenardella/rust7"
keywords = ["s7", "siemens", "plc", "industrial", "snap7"]
categories = ["network-programming","api-bindings"]

[lib]
name = "rust7"
path = "src/lib.rs"

[[example]]
name = "sdk_client"
path = "examples/sdk/client.rs"

[[example]]
name = "sdk_async_client"
path = "examples/sdk/async_client.rs"
required-features = ["tokio"]

[features]
## Asynchronous client `AsyncS7Client` on tokio.
tokio = ["dep:tokio"]

[dependencies]
anyerror = { version = "0.1.13", default-features = false }
tokio = { version = "1.48", optional = true, default-features = false, features = ["net", "time", "io-util"] }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1.48", features = ["net", "time", "io-util", "rt", "macros", "test-util"] }

[lints.rust]
# Set by cargo-fuzz; enables `client::fuzzing` for the targets in fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package.metadata.docs.rs]
features = ["tokio"]
